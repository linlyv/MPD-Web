music_directory         "/mnt/usb1_2-1/Music"
playlist_directory      "/mnt/usb1_2-1/Music/Playlists"
db_file                 "/etc/mpd/mpd.db"
pid_file                "/run/mpd.pid"
state_file              "/etc/mpd/mpd.state"
sticker_file            "/etc/mpd/sticker.sql"
auto_update             "yes"
save_absolute_paths_in_playlists "no"




port "6601"
bind_to_address "any"
log_level "warning"
input_cache {
    size "128M"
}
audio_buffer_size "64M"


audio_output {
    type            "alsa"
    name            "USB_Audio_Card1"
    device          "hw:1,0"
    mixer_type      "software"
    auto_resample   "yes"   
    enabled         "no"
}

audio_output {
    type            "alsa"
    name            "USB_Audio"
    device          "hw:0,0"
    mixer_type      "software"
    auto_resample   "yes"   
    enabled         "no"
}

audio_output {
    type            "httpd"
    name            "MPD HTTP Stream"
    encoder         "lame"
    port            "8000"
    bind_to_address "0.0.0.0"
    bitrate         "192"
    format          "44100:16:2"
    max_clients     "4"
    enabled         "yes"
}